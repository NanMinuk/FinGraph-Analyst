services:

  # ── Neo4j Graph DB ────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── FastAPI ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      API_URL: http://api:8000
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/workspace/data/chroma_langchain
      - embed_cache:/workspace/data/embedding_cache
    depends_on:
      neo4j:
        condition: service_healthy

  # ── Streamlit UI ──────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    env_file: .env
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  neo4j_data:
  chroma_data:
  embed_cache:
